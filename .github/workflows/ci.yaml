name: Test check with maven

on:
  push:
  pull_request:
    branches: [ "dev" ]

jobs:
  backend-testing:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0 # Specify the version you need
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: timetracker
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3 # Health check for the service
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B package --file back/pom.xml
      - name: Test with Maven
        run: DB_HOST=localhost mvn test -f back/pom.xml -Dtest=com.orion.timetracker.main.**
    frontend-testing:
      runs-on: ubuntu-latest
      strategy:
        matrix:
          node-version: [ 18.x, 20.x, 22.x ]
          # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

        steps:
          - uses: actions/checkout@v4
          - name: Use Node.js ${{ matrix.node-version }}
            uses: actions/setup-node@v4
            with:
              node-version: ${{ matrix.node-version }}
              cache: 'npm'
          - name: Install project
            run: npm  --prefix front/ install
          - name: Tests project
            run: npm --prefix front/ test front/src/__tests__