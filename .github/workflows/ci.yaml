name: Test check with maven

on:
  push:
  pull_request:
    branches: [ "dev" ]

jobs:
  backend-testing:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0 # Specify the version you need
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: timetracker
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3 # Health check for the service
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B package --file back/pom.xml
      - name: Test with Maven
        run: DB_HOST=localhost mvn test -f back/pom.xml -Dtest=com.orion.timetracker.main.**

  frontend-testing:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 18.x, 20.x, 22.x ]
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: "./front/package-lock.json"
    - name: Install project
      run: npm --prefix front/ install
    - name: Tests project
      run: npm --prefix front/ test front/src/__tests__
  
  embedded-testing:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Prepare project (installing dependencies)
      run: |
        pip install --upgrade pip
        python -m venv embedded/.venv
        source embedded/.venv/bin/activate
        pip install -r embedded/requirements.txt
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test project
      run: |
        pytest embedded/tests